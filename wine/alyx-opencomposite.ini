; Half-Life: Alyx on the Mac -> Frame chain: beside OpenComposite's openvr_api.dll in game/bin/win64/.
; supersampleRatio scales the eye size OpenComposite recommends. With opencomposite-frametiming.patch (built in by
; build-opencomposite.sh) Alyx's auto-fidelity sees real frame times and lowers its own level when the GPU is full,
; so the full size is the default: worn in-world 2026-11-03 it held 88 renders/s, and in a blind comparison it was
; preferred over 0.81 (wine/README.md, Half-Life: Alyx). On an OpenComposite built without that patch, use 0.81.
supersampleRatio=1.0
