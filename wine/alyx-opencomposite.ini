; Half-Life: Alyx on the Mac -> Frame chain: beside OpenComposite's openvr_api.dll in game/bin/win64/.
; supersampleRatio scales the eye size OpenComposite recommends, and Alyx draws its default level at that size / 1.231.
; 0.81 draws 1399 per eye instead of 1728. Worn in-world 2026-10-31 it took Alyx from 29 to 88 renders/s, and in a
; blind comparison it was preferred over 1.0 (wine/README.md, Half-Life: Alyx).
supersampleRatio=0.81
