[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
; frame-lab: VR budget on a base M5. Lumen + virtual shadow maps + TSR at 4320x2160 measured 66 ms of GPU per
; frame (FrameXR frame-loop line); the smoke wants the cube at the panel rate, not the lighting.
r.Shadow.Virtual.Enable=0
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
; FXAA, not TAA: TAA ghosted camera-attached HUD text and softened the scene, worn on the Steam Frame.
; Forward + MSAA 2x (unreal-vr's renderer) missed 90 Hz in this scene: 87 fps, the dynamic lights are the likely cost.
; FXAA at 100 % screen percentage: 90.0 fps, no late frames, GPU 6.9-7.9 ms, HUD text clean, worn the same day.
; A shipping VR project should still go forward + MSAA with baked lighting, the way engines/unreal-vr is set up.
; Edges here are FXAA-smoothed, so expect a little shimmer on thin lines.
r.AntiAliasingMethod=1
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.Nanite=0
; Template_Default's VolumetricCloud actor alone was 28.7 of the 38.3 ms GPU frame (ProfileGPU).
r.VolumetricCloud=0
r.VolumetricFog=0
; 1.0: 2160x2160 per eye, 9.2-10.2 ms GPU (ProfileGPU, game7/game9). Alone that is 90 fps; with the Frame client attached
; the runtime's copy+foveation passes share the GPU (+1.4 ms) and the engine gap goes 11.08 -> 11.9-12.2 ms (82-84 fps)
; the second the client connects. vr.PixelDensity is registered after the plugin sizes its swapchain
; ("deferred - dummy variable created"), so the density lives under [FrameXR] below, and the render size is set by r.ScreenPercentage with
; r.ScreenPercentage.Default.VR.Mode=0 further down.
vr.PixelDensity=1.0
; r.Shadow.StencilCulling=0 was tried to silence the once-per-run ensure in UseShadowStencilCulling (ShadowRendering.cpp:798):
; it cost 3.2 ms of GPU (shadow projection splits 0.22 -> 0.45-0.78 ms each, game8). The ensure stays; the crash reporter
; it launched is switched off in DefaultEditorSettings.ini instead.

; --- frame-lab additions ---
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Templates/Template_Default
GlobalDefaultGameMode=/Script/UnrealSmoke.SmokeGameMode

[HMDPluginPriority]
FrameXR=60

; frame-lab: the editor's UDP message bus is a second listening socket the Mac's application firewall asks
; about; the smoke needs only the OXRSys runtime's own ports (9944-9946).
[/Script/UdpMessaging.UdpMessagingSettings]
EnableTransport=False

; FrameXR eye buffers + swapchain as a fraction of the runtime's recommended 2160x2160 (0.5-1.0); env FRAMEXR_PIXEL_DENSITY
; overrides. 0.8 ran at 90 fps (GPU 6.3-7.5 ms) but OXRSys's foveated encoder refuses a source smaller than its target eye
; (SourceCoversFoveationTarget: "invalid foveated texture, dimensions..." and the encoder drain then wedges reconnects,
; game11), and foveation is only announced at the runtime's resolution_scale 1.0. So 1.0 with foveation; the render cost
; comes down through the engine's screen percentage instead ([SystemSettings] below).
[FrameXR]
PixelDensity=1.0

; Internal render resolution with the eye target kept at 2160x2160 for the foveated encoder: VR mode 0 = manual, driven by
; r.ScreenPercentage (100: FXAA does not upsample, so below 100 the text goes soft). The ProfileGPU TAA line reports the input size, so a run shows whether it applied.
[SystemSettings]
r.ScreenPercentage.Default.VR.Mode=0
r.ScreenPercentage=100
